name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Core tests
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Decode keystore
        run: echo "$KIKI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiki-release.jks"
        env:
          KIKI_KEYSTORE_BASE64: ${{ secrets.KIKI_KEYSTORE_BASE64 }}
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease && cp app/build/outputs/apk/release/app-release.apk "kiki-${GITHUB_REF_NAME}.apk"
        env:
          KIKI_KEYSTORE_PATH: ${{ runner.temp }}/kiki-release.jks
          KIKI_KEYSTORE_PASSWORD: ${{ secrets.KIKI_KEYSTORE_PASSWORD }}
          KIKI_KEY_ALIAS: ${{ secrets.KIKI_KEY_ALIAS }}
          KIKI_KEY_PASSWORD: ${{ secrets.KIKI_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: kiki-${{ github.ref_name }}.apk
