<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>kiki</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="logo">k</div>
      <h1>kiki</h1>
    </header>

    <section id="setup" hidden>
      <label for="topic">Ton code secret</label>
      <input id="topic" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p id="topic-error" class="status error" hidden>Code invalide</p>
      <button id="save">Enregistrer</button>
    </section>

    <section id="compose" hidden>
      <textarea id="message" maxlength="300" placeholder="Ton message…" rows="5"></textarea>
      <div class="row">
        <span id="count">0/300</span>
        <button id="send" disabled>Envoyer</button>
      </div>
      <p id="status" class="status" hidden></p>
      <a href="#" id="change">Changer de code</a>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
