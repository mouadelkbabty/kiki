<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>kiki</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=2.1.0">
</head>
<body>
  <main>
    <header>
      <div class="logo">k</div>
      <h1>kiki</h1>
      <span id="tv" class="tv">…</span>
    </header>

    <section id="setup" hidden>
      <label for="topic">Ton code secret (32 caractères)</label>
      <p class="hint">🔐 Tout est chiffré sur ton téléphone avant l'envoi. Rien n'est conservé sur le serveur.</p>
      <input id="topic" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p id="topic-error" class="status error" hidden>Code invalide</p>
      <button id="save">Enregistrer</button>
    </section>

    <section id="compose" hidden>
      <label for="name">Ton nom (affiché sur la télé)</label>
      <input id="name" maxlength="20" placeholder="momo" autocomplete="off">
      <div class="tabs">
        <button id="tab-message" class="tab active">💬 Message</button>
        <button id="tab-poll" class="tab">📊 Sondage</button>
      </div>

      <div id="message-pane">
        <div class="quick">
          <button class="chip" data-text="ana jay">ana jay</button>
          <button class="chip" data-text="ana khrejt mn lkhdma o jay">ana khrejt mn lkhdma o jay</button>
          <button class="chip" data-text="7li lbab">7li lbab</button>
        </div>
        <div id="preview" hidden>
          <img id="sticker" alt="Sticker">
          <button id="remove" aria-label="Enlever le sticker">✕</button>
        </div>
        <textarea id="message" maxlength="300" placeholder="Ton message… (un emoji seul s'affiche en géant)" rows="4"></textarea>
        <div class="row">
          <label class="photo" aria-label="Ajouter une photo">📷<input id="photo" type="file" accept="image/*" hidden></label>
          <span id="count">0/300</span>
          <button id="send" disabled>Envoyer</button>
        </div>
      </div>

      <div id="poll-pane" hidden>
        <input id="question" maxlength="200" placeholder="Ta question… (ex. Pizza ou sushi ?)">
        <input class="choice" maxlength="40" placeholder="Choix 1 (ex. 🍕 Pizza)">
        <input class="choice" maxlength="40" placeholder="Choix 2 (ex. 🍣 Sushi)">
        <input class="choice" maxlength="40" placeholder="Choix 3 (facultatif)">
        <button id="send-poll" disabled>Envoyer le sondage</button>
      </div>

      <p id="status" class="status" hidden></p>

      <h2>Derniers envois</h2>
      <ul id="history"></ul>

      <a href="#" id="change">Changer de code</a>
    </section>
  </main>
  <script src="app.js?v=2.1.0"></script>
</body>
</html>
